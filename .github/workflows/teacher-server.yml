name: Deploy teacher server
on:
  workflow_dispatch:
    inputs:
      verify_quran:
        description: Verify Quran Foundation production access before deploying
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/quran-content.test.mjs
      - run: node verify-profiles.mjs
      - run: node verify-accounts.mjs
      - run: node verify-ai.mjs
      - run: node verify-learning-routes.mjs
      - run: node verify-assignments.mjs
      - run: node verify-sunday-workflow.mjs
      - run: node verify-quran-progress.mjs
      - run: pnpm build
      - name: Verify Quran Foundation production access
        if: ${{ inputs.verify_quran }}
        env:
          QURAN_CLIENT_ID: ${{ secrets.QURAN_CLIENT_ID }}
          QURAN_CLIENT_SECRET: ${{ secrets.QURAN_CLIENT_SECRET }}
        run: node scripts/check-quran-connection.mjs
      - name: Bind the D1 database
        env:
          TAMKEEN_D1_DATABASE_ID: ${{ secrets.TAMKEEN_D1_DATABASE_ID }}
        run: node scripts/prepare-teacher-deploy.mjs
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -d drizzle
          cp -R drizzle dist/server/drizzle
          pnpm exec wrangler d1 migrations apply tamkeen-maqraah --remote --config dist/server/wrangler.json
      - name: Publish the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
      - name: Store the server keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEACHER_KEY: ${{ secrets.TEACHER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$TEACHER_KEY" | pnpm exec wrangler secret put TEACHER_KEY --config dist/server/wrangler.json
          printf '%s' "$GEMINI_API_KEY" | pnpm exec wrangler secret put GEMINI_API_KEY --config dist/server/wrangler.json
      - name: Store Quran Foundation credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QURAN_CLIENT_ID: ${{ secrets.QURAN_CLIENT_ID }}
          QURAN_CLIENT_SECRET: ${{ secrets.QURAN_CLIENT_SECRET }}
        run: |
          test -n "$QURAN_CLIENT_ID" && test -n "$QURAN_CLIENT_SECRET"
          printf '%s' "$QURAN_CLIENT_ID" | pnpm exec wrangler secret put QURAN_CLIENT_ID --config dist/server/wrangler.json
          printf '%s' "$QURAN_CLIENT_SECRET" | pnpm exec wrangler secret put QURAN_CLIENT_SECRET --config dist/server/wrangler.json
